name: build

# Pull requests run on the PR event only; a push runs for main and for version tags. A branch with an open PR therefore
# runs once per commit, not twice, and a newer commit cancels the older run of the same branch/PR.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  # 1. Fast tests that need no Qt (assembler, CPU, machine, catalog, docs, examples ...).
  unit:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so test_cpu_core_files_are_untouched_by_phase2 can diff against bd82989
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Deliberately NO Qt system libraries here: with -m "not gui" tests/conftest.py does not import the GUI test
      # modules at all, so this stage must run without Qt. On Linux any accidental PySide6 import fails (libEGL).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests (no Qt)
        run: python -m pytest -q -m "not gui" --timeout-method=${{ runner.os == 'Windows' && 'thread' || 'signal' }}

  # 2. The GUI tests (offscreen Qt), their own job so a stall or failure is easy to see. Same tests on both systems.
  gui:
    name: gui (${{ matrix.os }})
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Linux system libraries for Qt (offscreen)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Check that the unit and gui stages together cover the whole suite
        shell: bash
        run: |
          count() { python -m pytest --collect-only -q "$@" | tail -1 | grep -oE '^[0-9]+'; }
          total=$(count); unit=$(count -m "not gui"); gui=$(count -m gui)
          echo "total=$total unit=$unit gui=$gui"
          test -n "$total" && test "$((unit + gui))" -eq "$total"
      - name: GUI tests
        run: python -m pytest -q -m gui --timeout-method=${{ runner.os == 'Windows' && 'thread' || 'signal' }}

  # 3. Package, self-test and installer, only after every test passed.
  package:
    name: package (${{ matrix.os }})
    needs: [unit, gui]
    strategy:
      fail-fast: false
      matrix:
        # The Linux bundle carries libraries from the build machine, so it only runs on systems with at least the build
        # machine's glibc. ubuntu-latest (26.04, glibc 2.43) produced a bundle that failed on Ubuntu 24.04 LTS; build on
        # the oldest supported runner instead (22.04, glibc 2.35).
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Linux system libraries for Qt (offscreen)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build wheel
        if: runner.os == 'Linux'
        run: |
          pip install build
          python -m build
      - name: Package with PyInstaller
        run: pyinstaller packaging/studio8085.spec --noconfirm

      - name: Self-test the packaged app (Linux)
        if: runner.os == 'Linux'
        run: ./dist/8085Studio/8085Studio --selftest
      - name: Check the Linux bundle's glibc requirement (must run on Ubuntu 22.04 / glibc 2.35)
        if: runner.os == 'Linux'
        run: |
          need=$(find dist/8085Studio -type f \( -name '*.so*' -o -name 8085Studio \) -exec objdump -T {} + 2>/dev/null \
                 | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "highest glibc symbol version required: $need"
          test -n "$need" && test "$(printf '%s\n' "$need" 2.35 | sort -V | tail -1)" = "2.35"
      - name: Self-test the packaged app (Windows)
        if: runner.os == 'Windows'
        run: .\dist\8085Studio\8085Studio.exe --selftest

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\studio8085.iss

      - name: Archive Linux build
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/8085Studio-linux-x86_64.tar.gz 8085Studio

      - name: SHA-256 checksums (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          sha256sum 8085Studio-linux-x86_64.tar.gz *.whl studio8085-*.tar.gz > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt
      - name: SHA-256 checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem dist\installer\*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Tee-Object dist\SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: 8085Studio-${{ runner.os }}
          path: |
            dist/8085Studio-linux-x86_64.tar.gz
            dist/installer/*.exe
            dist/*.whl
            dist/studio8085-*.tar.gz
            dist/SHA256SUMS-*.txt
            docs/RELEASE_NOTES.md
            docs/INSTRUCTION_MATRIX.md
          if-no-files-found: ignore
