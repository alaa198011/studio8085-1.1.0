[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studio8085"
version = "1.1.0"
description = "Assembler, simulator and debugger for the Intel 8085 microprocessor, with a modern Qt interface"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["8085", "assembler", "simulator", "emulator", "debugger", "education", "microprocessor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Software Development :: Assemblers",
    "Topic :: Software Development :: Debuggers",
]
dependencies = ["PySide6-Essentials>=6.5"]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6"]

[project.gui-scripts]
studio8085 = "studio8085.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"studio8085" = ["examples/*.asm", "examples/beginner/*.asm", "examples/trainer/*.asm"]
"studio8085.ui" = ["styles/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:.*propagateSizeHints.*"]
